<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pong</title>
<style>
  :root {
    --fg: #e8e8e8;
    --bg: #0a0a0a;
    --accent: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 6px;
    font-weight: 600;
    color: var(--accent);
  }
  canvas {
    background: #000;
    border: 1px solid #222;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  .hint {
    font-size: 12px;
    color: #888;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <h1>PONG</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <p class="hint">
    <kbd>W</kbd> / <kbd>S</kbd> or <kbd>&uarr;</kbd> / <kbd>&darr;</kbd> to move &nbsp;&middot;&nbsp;
    <kbd>Space</kbd> to pause &nbsp;&middot;&nbsp; you cannot win
  </p>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const PADDLE_W = 12;
  const PADDLE_H = 80;
  const PADDLE_MARGIN = 24;
  const BALL_SIZE = 12;
  const PLAYER_SPEED = 6;
  const AI_SPEED = 16;          // fast enough to always arrive first
  const LOSE_SCORE = 11;        // the bot always gets here; you never do

  const player = { x: PADDLE_MARGIN, y: H / 2 - PADDLE_H / 2 };
  const ai = { x: W - PADDLE_MARGIN - PADDLE_W, y: H / 2 - PADDLE_H / 2 };
  const ball = { x: 0, y: 0, vx: 0, vy: 0 };

  const keys = new Set();
  let paused = false;
  let over = false;
  let cpuScore = 0;
  let pointSpeed = 6;   // ramps up every point so it gets worse, never better
  let rally = 0;        // paddle touches in the current point
  let longestRally = 0; // the only number you can move

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function serve() {
    ball.x = W / 2 - BALL_SIZE / 2;
    ball.y = H / 2 - BALL_SIZE / 2;
    pointSpeed = 6;
    rally = 0;
    // Always served toward the player, gently, so they get one honest touch.
    const angle = (Math.random() * 0.5 - 0.25);
    ball.vx = -Math.cos(angle) * pointSpeed;
    ball.vy = Math.sin(angle) * pointSpeed;
  }

  function resetGame() {
    cpuScore = 0;
    longestRally = 0;
    over = false;
    serve();
  }

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (over) { resetGame(); return; }
      paused = !paused;
      return;
    }
    keys.add(e.code);
  });
  document.addEventListener("keyup", (e) => keys.delete(e.code));

  function pointerMove(clientY) {
    const rect = canvas.getBoundingClientRect();
    const scale = H / rect.height;
    const y = (clientY - rect.top) * scale;
    player.y = clamp(y - PADDLE_H / 2, 0, H - PADDLE_H);
  }
  canvas.addEventListener("mousemove", (e) => pointerMove(e.clientY));
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    pointerMove(e.touches[0].clientY);
  }, { passive: false });

  // Where the ball will cross the bot's plane, accounting for wall bounces.
  function predictBotY() {
    if (ball.vx <= 0) return H / 2 - PADDLE_H / 2;
    const frames = (ai.x - ball.x) / ball.vx;
    const span = 2 * (H - BALL_SIZE);
    let y = (((ball.y + ball.vy * frames) % span) + span) % span;
    if (y > H - BALL_SIZE) y = span - y;
    return y + BALL_SIZE / 2 - PADDLE_H / 2;
  }

  function update() {
    if (paused || over) return;

    if (keys.has("KeyW") || keys.has("ArrowUp")) player.y -= PLAYER_SPEED;
    if (keys.has("KeyS") || keys.has("ArrowDown")) player.y += PLAYER_SPEED;
    player.y = clamp(player.y, 0, H - PADDLE_H);

    // The bot: knows exactly where the ball is going and gets there.
    const target = ball.vx > 0 ? predictBotY() : H / 2 - PADDLE_H / 2;
    ai.y = clamp(ai.y + clamp(target - ai.y, -AI_SPEED, AI_SPEED), 0, H - PADDLE_H);

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0) { ball.y = 0; ball.vy *= -1; }
    if (ball.y + BALL_SIZE >= H) { ball.y = H - BALL_SIZE; ball.vy *= -1; }

    if (hit(player)) playerBounce();
    if (hit(ai)) botBounce();

    // Player misses -> bot scores. (The ball never gets past the bot.)
    if (ball.x + BALL_SIZE < 0) {
      cpuScore++;
      longestRally = Math.max(longestRally, rally);
      if (cpuScore >= LOSE_SCORE) { over = true; longestRally = Math.max(longestRally, rally); }
      else serve();
    }
    if (ball.x > W) {
      // Should never happen, but if it somehow does, the bot just re-serves.
      serve();
    }
  }

  function hit(p) {
    return ball.x < p.x + PADDLE_W &&
           ball.x + BALL_SIZE > p.x &&
           ball.y < p.y + PADDLE_H &&
           ball.y + BALL_SIZE > p.y;
  }

  // Player's return: an honest reflection with spin off the paddle.
  function playerBounce() {
    rally++;
    const rel = (ball.y + BALL_SIZE / 2 - (player.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 15);
    const angle = rel * (Math.PI / 4);
    ball.vx = Math.abs(Math.cos(angle) * speed);
    ball.vy = Math.sin(angle) * speed;
    ball.x = player.x + PADDLE_W;
  }

  // Bot's return: faster every touch, aimed at the corner you're farthest from.
  function botBounce() {
    rally++;
    pointSpeed = Math.min(pointSpeed + 1.5, 20);
    const playerCenter = player.y + PADDLE_H / 2;
    const targetY = playerCenter < H / 2 ? (H - BALL_SIZE - 8) : 8;
    const dist = ball.x - (player.x + PADDLE_W);
    const frames = Math.max(dist / pointSpeed, 1);
    ball.vx = -pointSpeed;
    ball.vy = clamp((targetY - ball.y) / frames, -18, 18);
    ball.x = ai.x - BALL_SIZE;
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#222";
    for (let y = 0; y < H; y += 24) ctx.fillRect(W / 2 - 1, y, 2, 14);

    ctx.fillStyle = "#e8e8e8";
    ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
    ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

    ctx.font = "42px 'SF Mono', ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "#555";
    ctx.fillText("0", W / 2 - 60, 56);
    ctx.fillStyle = "#e8e8e8";
    ctx.fillText(cpuScore, W / 2 + 60, 56);

    ctx.font = "11px 'SF Mono', ui-monospace, Menlo, monospace";
    ctx.fillStyle = "#666";
    ctx.fillText("YOU", W / 2 - 60, 74);
    ctx.fillText("CPU", W / 2 + 60, 74);
    ctx.textAlign = "left";
    ctx.fillText("LONGEST RALLY  " + longestRally, 16, H - 14);

    if (paused && !over) banner("PAUSED");
    if (over) banner("CPU WINS " + cpuScore + "-0  —  SPACE TO TRY AGAIN");
  }

  function banner(text) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, H / 2 - 30, W, 60);
    ctx.fillStyle = "#f87171";
    ctx.font = "18px 'SF Mono', ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText(text, W / 2, H / 2 + 6);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  serve();
  loop();
})();
</script>
</body>
</html>
