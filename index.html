<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcade</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14141a;
    color: #e8e8e8;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 48px 20px;
    min-height: 100vh;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 12px;
    font-weight: 700;
    color: #ffd54a;
    text-shadow: 0 0 24px rgba(255, 213, 74, 0.25);
  }
  .sub {
    margin: -20px 0 0;
    font-size: 12px;
    letter-spacing: 3px;
    color: #777;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 260px));
    gap: 20px;
    width: 100%;
    max-width: 560px;
    justify-content: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px;
    border: 1px solid #2c2c36;
    border-radius: 10px;
    background: #1c1c24;
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #ffd54a;
    background: #22222c;
  }
  .art {
    height: 96px;
    border-radius: 6px;
    background: #000;
    position: relative;
    overflow: hidden;
  }
  /* pong art */
  .pong-l, .pong-r { position: absolute; width: 6px; height: 34px; background: #e8e8e8; top: 50%; transform: translateY(-50%); }
  .pong-l { left: 14px; }
  .pong-r { right: 14px; top: 34%; }
  .pong-ball { position: absolute; width: 8px; height: 8px; background: #f87171; left: 46%; top: 44%; }
  .pong-net { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(#333 0 8px, transparent 8px 16px); }
  /* flappy art */
  .flappy { background: linear-gradient(#4ec0e6, #bfe9c9); }
  .fb-bird { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #ffd54a; border: 2px solid #000; left: 30%; top: 40%; }
  .fb-pipe { position: absolute; width: 20px; background: #5aa544; border: 2px solid #2f5f23; right: 28%; }
  .fb-pipe.top { top: -2px; height: 32px; }
  .fb-pipe.bot { bottom: -2px; height: 34px; }
  .fb-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: #ded6a3; border-top: 3px solid #c9bf82; }
  .name { font-size: 15px; letter-spacing: 3px; font-weight: 700; color: #ffd54a; }
  .desc { font-size: 11px; line-height: 1.5; color: #9a9aa4; }
  footer { font-size: 11px; color: #555; letter-spacing: 1px; }
  footer a { color: #888; }
</style>
</head>
<body>
  <h1>ARCADE</h1>
  <p class="sub">PICK A GAME</p>

  <div class="grid">
    <a class="card" href="pong.html">
      <div class="art">
        <span class="pong-net"></span>
        <span class="pong-l"></span>
        <span class="pong-r"></span>
        <span class="pong-ball"></span>
      </div>
      <span class="name">PONG</span>
      <span class="desc">Play an overpowered bot that cannot be beaten. Your score stays at zero. The only thing you control is how long you last.</span>
    </a>

    <a class="card" href="flappy.html">
      <div class="art flappy">
        <span class="fb-pipe top"></span>
        <span class="fb-pipe bot"></span>
        <span class="fb-bird"></span>
        <span class="fb-ground"></span>
      </div>
      <span class="name">FLAPPY</span>
      <span class="desc">A Flappy Bird remake. Gravity, one button, and a scrolling ground platform. Dodge the pipes, beat your best.</span>
    </a>
  </div>

  <footer>source on <a href="https://github.com/Revan-dev/pong">github</a></footer>
</body>
</html>
